<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Alert Translation Search</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        h1 {
            color: #333;
            border-bottom: 3px solid #4CAF50;
            padding-bottom: 10px;
        }.search-container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }.search-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }.search-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }
        
        select, input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #4CAF50;
        }.mode-help {
            margin: 8px 0 15px;
            padding: 10px 12px;
            border-radius: 6px;
            background: #f4f8ff;
            border: 1px solid #d6e4ff;
            color: #2a3a4a;
            line-height: 1.45;
        }.mode-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
            align-items: end;
        }.upload-panel {
            background: #f7fbff;
            border: 1px solid #d8e9ff;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
        }.upload-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }.upload-btn {
            background: #1976d2;
            color: white;
        }.upload-btn:hover {
            background: #125ca1;
        }.loaded-files-info {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px 12px;
            border-radius: 4px;
            margin-top: 10px;
            font-weight: 600;
        }.button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }.search-btn {
            background: #4CAF50;
            color: white;
        }.search-btn:hover {
            background: #45a049;
        }.reset-btn {
            background: #f44336;
            color: white;
        }.reset-btn:hover {
            background: #da190b;
        }.results-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: 600;
            color: #1976d2;
        }.alert-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            border-left: 4px solid #4CAF50;
        }.alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }.alert-id {
            font-weight: 700;
            color: #333;
            font-size: 16px;
        }.alert-scenario {
            background: #4CAF50;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }.source-text {
            background: #fff3cd;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            border-left: 3px solid #ffc107;
        }.source-label {
            font-weight: 600;
            color: #856404;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }.translations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
        }.translation-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }.lang-code {
            font-weight: 700;
            color: #1976d2;
            text-transform: uppercase;
            font-size: 12px;
            margin-bottom: 5px;
        }.translation-text {
            color: #333;
            line-height: 1.5;
        }.no-results {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 8px;
            color: #666;
        }.loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #666;
        }.pagination-controls {
            margin: 20px 0 40px;
            display: flex;
            justify-content: center;
        }.load-more-btn {
            background: #1976d2;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }.load-more-btn:hover {
            background: #125ca1;
        }
    </style>
</head>
<body>
    <!--
        Single-page demo with two data sources:
        1) Manifest mode: lazy loads scenario files listed in demo/data/manifest.json.
        2) Upload mode: reads local JSONL/JSON files selected by the user.
    -->
    <h1>🚨 Emergency Alert Translation Search</h1>
    
    <div class="search-container">
        <div class="mode-row">
            <div class="search-group">
                <label for="dataMode">Data Mode:</label>
                <select id="dataMode">
                    <option value="manifest">Bundled demo data (manifest)</option>
                    <option value="upload">Upload local folder (JSONL)</option>
                </select>
            </div>
        </div>
        <div id="modeHelp" class="mode-help" aria-live="polite"></div>

        <div id="uploadPanel" class="upload-panel" style="display: none;">
            <div class="upload-row">
                <input id="directoryInput" type="file" webkitdirectory directory multiple>
                <button class="upload-btn" onclick="loadSelectedFiles()">Load Folder</button>
            </div>
            <div id="loadedFilesInfo" class="loaded-files-info" style="display: none;"></div>
        </div>

        <div class="search-row">
            <div class="search-group">
                <label for="scenarioFilter">Alert Type (Scenario):</label>
                <select id="scenarioFilter">
                    <option value="">All Scenarios</option>
                </select>
            </div>
            
            <div class="search-group">
                <label for="sourceFilter">Source Language:</label>
                <select id="sourceFilter">
                    <option value="">All Source Languages</option>
                </select>
            </div>
            
            <div class="search-group">
                <label for="targetFilter">Target Language:</label>
                <select id="targetFilter">
                    <option value="">All Target Languages</option>
                </select>
            </div>
            
            <div class="search-group">
                <label for="textSearch">Search Text:</label>
                <input type="text" id="textSearch" placeholder="Search in translations...">
            </div>
        </div>
        
        <div class="button-group">
            <button class="search-btn" onclick="filterAlerts()">🔍 Search</button>
            <button class="reset-btn" onclick="resetFilters()">↻ Reset</button>
        </div>
    </div>
    
    <div id="resultsInfo" class="results-info" style="display: none;"></div>
    <div id="output"></div>
    <div id="paginationControls" class="pagination-controls"></div>

    <script>
        // Application state
        let alertsData = [];
        let uploadedAlertsData = [];
        let filteredAlerts = [];
        let manifest = null;
        const scenarioCache = {};
        const scenarioCacheOrder = [];

        // UI modes
        const MODE_MANIFEST = 'manifest';
        const MODE_UPLOAD = 'upload';
        let activeMode = MODE_MANIFEST;

        // Rendering and loading limits
        let currentPage = 1;
        const PAGE_SIZE = 25;
        const MANIFEST_PATH = 'data/manifest.json';
        const SCENARIO_CACHE_LIMIT = 4;
        const MAX_FILTERED_ALERTS_BUFFER = 1500;

        let searchDebounceTimer = null;
        let totalMatchingAlerts = 0;
        let totalAlertsScanned = 0;
        let matchesWereTruncated = false;

        function debounceFilter() {
            if (searchDebounceTimer) {
                clearTimeout(searchDebounceTimer);
            }
            searchDebounceTimer = setTimeout(filterAlerts, 250);
        }

        function isEnglishLanguage(langCode) {
            const code = (langCode || '').toLowerCase();
            return code === 'en' || code === 'eng' || code === 'english';
        }

        function formatAlertId(alertId) {
            const id = String(alertId || '');
            const firstDash = id.indexOf('-');
            if (firstDash !== -1 && firstDash < id.length - 1) {
                return id.slice(firstDash + 1);
            }
            return id;
        }

        function preloadAlertMetadata(alert) {
            // Cache source language for cheaper render path.
            alert.__sourceLang = Object.keys(alert.source || {})[0] || 'eng';
            return alert;
        }

        function clearFilterOptions() {
            document.getElementById('scenarioFilter').innerHTML = '<option value="">All Scenarios</option>';
            document.getElementById('sourceFilter').innerHTML = '<option value="">All Source Languages</option>';
            document.getElementById('targetFilter').innerHTML = '<option value="">All Target Languages</option>';
        }

        function showLoadedFilesInfo(fileCount, alertCount) {
            const info = document.getElementById('loadedFilesInfo');
            info.style.display = 'block';
            info.textContent = `Loaded ${fileCount} file(s) with ${alertCount} alert(s)`;
        }

        function showNoUploadDataMessage() {
            document.getElementById('resultsInfo').style.display = 'none';
            document.getElementById('output').innerHTML = `
                <div class="no-results">
                    <h2>Upload Mode</h2>
                    <p>Select a folder and click Load Folder to begin.</p>
                </div>`;
            document.getElementById('paginationControls').innerHTML = '';
        }

        function updateModeHelp(mode) {
            const help = document.getElementById('modeHelp');
            if (!help) {
                return;
            }

            if (mode === MODE_UPLOAD) {
                help.innerHTML = '<strong>Upload local folder (JSONL):</strong> choose this if you want to explore your own files from your computer. Load Folder is required before search results appear.';
                return;
            }

            help.innerHTML = '<strong>Bundled demo data (manifest):</strong> choose this for the quickest start with the dataset already included in this project. No local files are needed.';
        }

        function touchScenarioInCache(scenario) {
            // Keep a small LRU-like cache to avoid unbounded memory growth.
            const existingIndex = scenarioCacheOrder.indexOf(scenario);
            if (existingIndex !== -1) {
                scenarioCacheOrder.splice(existingIndex, 1);
            }
            scenarioCacheOrder.push(scenario);

            while (scenarioCacheOrder.length > SCENARIO_CACHE_LIMIT) {
                const oldest = scenarioCacheOrder.shift();
                delete scenarioCache[oldest];
            }
        }

        function alertMatchesFilters(alert, sourceLang, targetLang, searchText) {
            if (sourceLang && !alert.source[sourceLang]) {
                return false;
            }

            if (targetLang && !alert.translations[targetLang]) {
                return false;
            }

            if (searchText) {
                const sourceText = Object.values(alert.source || {}).join(' ').toLowerCase();
                const translationsText = Object.values(alert.translations || {}).join(' ').toLowerCase();
                if (!sourceText.includes(searchText) && !translationsText.includes(searchText)) {
                    return false;
                }
            }

            return true;
        }

        function renderPaginationControls() {
            const controls = document.getElementById('paginationControls');
            const shown = Math.min(currentPage * PAGE_SIZE, filteredAlerts.length);

            if (shown < filteredAlerts.length) {
                controls.innerHTML = `<button class="load-more-btn" onclick="loadMoreAlerts()">Load more (${shown}/${Math.min(totalMatchingAlerts, filteredAlerts.length)})</button>`;
                return;
            }

            if (matchesWereTruncated) {
                controls.innerHTML = '<div class="results-info">Large result set detected. Showing a limited buffer of matches. Add filters to narrow results.</div>';
                return;
            }

            controls.innerHTML = '';
        }

        function loadMoreAlerts() {
            currentPage += 1;
            displayAlerts(filteredAlerts);
            showResultsInfo(totalMatchingAlerts, totalAlertsScanned);
            renderPaginationControls();
        }

        function setOutputLoading(message) {
            document.getElementById('output').innerHTML = `<div class="loading">${message}</div>`;
        }

        async function parseJsonlTextFallback(text) {
            // Fallback parser when stream APIs are unavailable.
            const lines = text.trim().split('\n');
            const parsedAlerts = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) {
                    continue;
                }
                try {
                    parsedAlerts.push(preloadAlertMetadata(JSON.parse(line)));
                } catch (parseError) {
                    console.warn('Skipping malformed JSONL line', parseError);
                }

                if (i > 0 && i % 250 === 0) {
                    await new Promise(resolve => setTimeout(resolve, 0));
                }
            }

            return parsedAlerts;
        }

        async function parseJsonlResponse(response) {
            // Stream parser for fetch responses to avoid loading entire files into memory.
            if (!response.body) {
                const text = await response.text();
                return parseJsonlTextFallback(text);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffered = '';
            const parsedAlerts = [];

            while (true) {
                const { value, done } = await reader.read();
                buffered += decoder.decode(value || new Uint8Array(), { stream: !done });

                const lines = buffered.split('\n');
                buffered = lines.pop() || '';

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) {
                        continue;
                    }
                    try {
                        parsedAlerts.push(preloadAlertMetadata(JSON.parse(line)));
                    } catch (parseError) {
                        console.warn('Skipping malformed JSONL line', parseError);
                    }

                    if (parsedAlerts.length > 0 && parsedAlerts.length % 500 === 0) {
                        await new Promise(resolve => setTimeout(resolve, 0));
                    }
                }

                if (done) {
                    break;
                }
            }

            if (buffered.trim()) {
                try {
                    parsedAlerts.push(preloadAlertMetadata(JSON.parse(buffered.trim())));
                } catch (parseError) {
                    console.warn('Skipping malformed JSONL trailing line', parseError);
                }
            }

            return parsedAlerts;
        }

        async function parseJsonlFile(file) {
            // Stream parser for local uploaded files.
            if (!file.stream) {
                const text = await file.text();
                return parseJsonlTextFallback(text);
            }

            const reader = file.stream().getReader();
            const decoder = new TextDecoder();
            let buffered = '';
            const parsedAlerts = [];

            while (true) {
                const { value, done } = await reader.read();
                buffered += decoder.decode(value || new Uint8Array(), { stream: !done });

                const lines = buffered.split('\n');
                buffered = lines.pop() || '';

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) {
                        continue;
                    }
                    try {
                        parsedAlerts.push(preloadAlertMetadata(JSON.parse(line)));
                    } catch (parseError) {
                        console.warn(`Skipping malformed JSONL line in ${file.name}`, parseError);
                    }

                    if (parsedAlerts.length > 0 && parsedAlerts.length % 500 === 0) {
                        await new Promise(resolve => setTimeout(resolve, 0));
                    }
                }

                if (done) {
                    break;
                }
            }

            if (buffered.trim()) {
                try {
                    parsedAlerts.push(preloadAlertMetadata(JSON.parse(buffered.trim())));
                } catch (parseError) {
                    console.warn(`Skipping malformed JSONL trailing line in ${file.name}`, parseError);
                }
            }

            return parsedAlerts;
        }

        async function loadSelectedFiles() {
            // Upload mode entrypoint: read root-level JSONL/JSON files from selected folder.
            const fileInput = document.getElementById('directoryInput');
            const files = fileInput.files;

            if (!files || files.length === 0) {
                document.getElementById('output').innerHTML = '<div class="no-results"><h2>No Folder Selected</h2><p>Please choose a folder containing JSONL files.</p></div>';
                return;
            }

            const jsonlFiles = Array.from(files).filter(file => {
                const isJsonFile = file.name.endsWith('.jsonl') || file.name.endsWith('.json');
                const pathParts = (file.webkitRelativePath || '').split('/');
                return isJsonFile && pathParts.length === 2;
            });

            if (jsonlFiles.length === 0) {
                document.getElementById('output').innerHTML = '<div class="no-results"><h2>No JSONL Files Found</h2><p>No JSONL/JSON files found at the root of selected folder.</p></div>';
                return;
            }

            uploadedAlertsData = [];
            let loadedCount = 0;

            for (let i = 0; i < jsonlFiles.length; i++) {
                const file = jsonlFiles[i];
                setOutputLoading(`Loading file ${i + 1} of ${jsonlFiles.length}: ${file.name}`);
                const parsed = await parseJsonlFile(file);
                uploadedAlertsData.push(...parsed);
                loadedCount += 1;
                await new Promise(resolve => setTimeout(resolve, 0));
            }

            showLoadedFilesInfo(loadedCount, uploadedAlertsData.length);
            populateFilters();
            await filterAlerts();
        }

        async function loadScenarioData(scenario) {
            if (scenarioCache[scenario]) {
                return scenarioCache[scenario];
            }

            const path = manifest.files[scenario];
            const response = await fetch(path);
            if (!response.ok) {
                throw new Error(`Failed to load scenario file: ${scenario}`);
            }

            const parsed = await parseJsonlResponse(response);
            scenarioCache[scenario] = parsed;
            touchScenarioInCache(scenario);
            return parsed;
        }

        async function gatherMatchesAcrossScenarios(sourceLang, targetLang, searchText) {
            // When no scenario is selected in manifest mode, scan scenarios incrementally.
            const matched = [];
            let matchCount = 0;
            let scannedCount = 0;
            let truncated = false;

            for (let i = 0; i < manifest.scenarios.length; i++) {
                const scenario = manifest.scenarios[i];
                setOutputLoading(`Filtering scenario ${i + 1} of ${manifest.scenarios.length}...`);
                const scenarioAlerts = await loadScenarioData(scenario);
                scannedCount += scenarioAlerts.length;

                for (let j = 0; j < scenarioAlerts.length; j++) {
                    const alert = scenarioAlerts[j];
                    if (alertMatchesFilters(alert, sourceLang, targetLang, searchText)) {
                        matchCount += 1;
                        if (matched.length < MAX_FILTERED_ALERTS_BUFFER) {
                            matched.push(alert);
                        } else {
                            truncated = true;
                        }
                    }

                    if (j > 0 && j % 750 === 0) {
                        await new Promise(resolve => setTimeout(resolve, 0));
                    }
                }
            }

            return { matched, matchCount, scannedCount, truncated };
        }

        async function loadManifestData() {
            // Load manifest once, then reuse it for subsequent mode switches/searches.
            try {
                if (!manifest) {
                    setOutputLoading('Loading metadata...');
                    const response = await fetch(MANIFEST_PATH);
                    if (!response.ok) {
                        throw new Error('Could not load data manifest.');
                    }
                    manifest = await response.json();
                }

                populateFilters();
                if (manifest.scenarios.length > 0) {
                    document.getElementById('scenarioFilter').value = manifest.scenarios[0];
                }
                await filterAlerts();
            } catch (error) {
                document.getElementById('output').innerHTML =
                    `<div class="no-results">
                        <h2>Error Loading Data</h2>
                        <p>${error.message}</p>
                        <p>Make sure demo/data/manifest.json and scenario JSONL files exist.</p>
                    </div>`;
            }
        }

        function populateFiltersFromManifest() {
            clearFilterOptions();

            const scenarios = [...(manifest?.scenarios || [])].sort();
            const scenarioSelect = document.getElementById('scenarioFilter');
            scenarios.forEach(scenario => {
                const option = document.createElement('option');
                option.value = scenario;
                option.textContent = scenario.replace(/_/g, ' ').toUpperCase();
                scenarioSelect.appendChild(option);
            });

            const sourceLanguages = [...(manifest?.source_languages || [])].sort();
            const sourceSelect = document.getElementById('sourceFilter');
            sourceLanguages.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang;
                option.textContent = lang.toUpperCase();
                sourceSelect.appendChild(option);
            });

            const targetLanguages = [...(manifest?.target_languages || [])]
                .filter(lang => !isEnglishLanguage(lang))
                .sort();
            const targetSelect = document.getElementById('targetFilter');
            targetLanguages.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang;
                option.textContent = lang.toUpperCase();
                targetSelect.appendChild(option);
            });
        }

        function populateFiltersFromAlerts(alerts) {
            clearFilterOptions();

            const scenarios = [...new Set(alerts.map(alert => alert.scenario).filter(Boolean))].sort();
            const scenarioSelect = document.getElementById('scenarioFilter');
            scenarios.forEach(scenario => {
                const option = document.createElement('option');
                option.value = scenario;
                option.textContent = scenario.replace(/_/g, ' ').toUpperCase();
                scenarioSelect.appendChild(option);
            });

            const sourceLanguages = [...new Set(alerts
                .map(alert => Object.keys(alert.source || {})[0])
                .filter(Boolean))].sort();
            const sourceSelect = document.getElementById('sourceFilter');
            sourceLanguages.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang;
                option.textContent = lang.toUpperCase();
                sourceSelect.appendChild(option);
            });

            const targetLanguages = [...new Set(alerts.flatMap(alert => Object.keys(alert.translations || {})))]
                .filter(lang => !isEnglishLanguage(lang))
                .sort();
            const targetSelect = document.getElementById('targetFilter');
            targetLanguages.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang;
                option.textContent = lang.toUpperCase();
                targetSelect.appendChild(option);
            });
        }

        function populateFilters() {
            if (activeMode === MODE_UPLOAD) {
                populateFiltersFromAlerts(uploadedAlertsData);
                return;
            }
            populateFiltersFromManifest();
        }

        async function filterAlerts() {
            // Central filtering path for both modes.
            const scenario = document.getElementById('scenarioFilter').value;
            const sourceLang = document.getElementById('sourceFilter').value;
            const targetLang = document.getElementById('targetFilter').value;
            const searchText = document.getElementById('textSearch').value.toLowerCase();

            setOutputLoading('Loading alerts...');

            if (activeMode === MODE_UPLOAD) {
                alertsData = uploadedAlertsData;
                filteredAlerts = alertsData.filter(alert => {
                    if (scenario && alert.scenario !== scenario) return false;
                    return alertMatchesFilters(alert, sourceLang, targetLang, searchText);
                });

                totalMatchingAlerts = filteredAlerts.length;
                totalAlertsScanned = alertsData.length;
                matchesWereTruncated = false;
                currentPage = 1;

                displayAlerts(filteredAlerts);
                showResultsInfo(totalMatchingAlerts, totalAlertsScanned);
                renderPaginationControls();
                return;
            }

            if (!manifest) {
                await loadManifestData();
                return;
            }

            if (scenario) {
                alertsData = await loadScenarioData(scenario);
                filteredAlerts = alertsData.filter(alert => alertMatchesFilters(alert, sourceLang, targetLang, searchText));
                totalMatchingAlerts = filteredAlerts.length;
                totalAlertsScanned = alertsData.length;
                matchesWereTruncated = false;
            } else {
                const allScenarioMatches = await gatherMatchesAcrossScenarios(sourceLang, targetLang, searchText);
                filteredAlerts = allScenarioMatches.matched;
                totalMatchingAlerts = allScenarioMatches.matchCount;
                totalAlertsScanned = allScenarioMatches.scannedCount;
                matchesWereTruncated = allScenarioMatches.truncated;
            }

            currentPage = 1;
            displayAlerts(filteredAlerts);
            showResultsInfo(totalMatchingAlerts, totalAlertsScanned);
            renderPaginationControls();
        }

        function showResultsInfo(filtered, total) {
            const info = document.getElementById('resultsInfo');
            info.style.display = 'block';
            const shown = Math.min(currentPage * PAGE_SIZE, filteredAlerts.length);
            info.textContent = `Showing ${shown} of ${filtered} matching alerts (scanned: ${total})`;
        }

        function displayAlerts(alerts) {
            // Render only one page at a time to keep DOM size bounded.
            const output = document.getElementById('output');
            const targetLang = document.getElementById('targetFilter').value;
            const visibleAlerts = alerts.slice(0, currentPage * PAGE_SIZE);

            if (alerts.length === 0) {
                output.innerHTML = `
                    <div class="no-results">
                        <h2>No Results Found</h2>
                        <p>Try adjusting your search criteria.</p>
                    </div>`;
                return;
            }

            let html = '';
            visibleAlerts.forEach(alert => {
                const sourceLang = alert.__sourceLang;
                const sourceText = alert.source[sourceLang];
                const translationEntries = Object.entries(alert.translations || {})
                    .filter(([lang]) => !isEnglishLanguage(lang));
                let renderedTranslations = translationEntries;

                if (targetLang) {
                    renderedTranslations = translationEntries.filter(([lang]) => lang === targetLang);
                }

                html += `
                    <div class="alert-card">
                        <div class="alert-header">
                            <span class="alert-id">${formatAlertId(alert.id)}</span>
                            <span class="alert-scenario">${alert.scenario.replace(/_/g, ' ')}</span>
                        </div>

                        <div class="source-text">
                            <div class="source-label">Source (${sourceLang.toUpperCase()})</div>
                            <div>${sourceText}</div>
                        </div>

                        <div class="translations-grid">
                `;

                for (const [lang, text] of renderedTranslations) {
                    html += `
                        <div class="translation-item">
                            <div class="lang-code">${lang}</div>
                            <div class="translation-text">${text}</div>
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            });

            output.innerHTML = html;
        }

        async function resetFilters() {
            document.getElementById('scenarioFilter').value = '';
            document.getElementById('sourceFilter').value = '';
            document.getElementById('targetFilter').value = '';
            document.getElementById('textSearch').value = '';

            if (activeMode === MODE_UPLOAD && uploadedAlertsData.length === 0) {
                showNoUploadDataMessage();
                return;
            }

            await filterAlerts();
        }

        async function setMode(mode) {
            // Toggle between manifest-backed browsing and local-upload browsing.
            activeMode = mode;
            updateModeHelp(activeMode);
            const uploadPanel = document.getElementById('uploadPanel');
            const loadedInfo = document.getElementById('loadedFilesInfo');

            clearFilterOptions();
            document.getElementById('textSearch').value = '';
            document.getElementById('resultsInfo').style.display = 'none';
            document.getElementById('paginationControls').innerHTML = '';

            if (activeMode === MODE_UPLOAD) {
                uploadPanel.style.display = 'block';
                if (uploadedAlertsData.length > 0) {
                    alertsData = uploadedAlertsData;
                    populateFilters();
                    await filterAlerts();
                } else {
                    loadedInfo.style.display = 'none';
                    showNoUploadDataMessage();
                }
                return;
            }

            uploadPanel.style.display = 'none';
            loadedInfo.style.display = 'none';
            await loadManifestData();
        }

        document.getElementById('textSearch').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                filterAlerts();
            }
        });
        document.getElementById('textSearch').addEventListener('input', debounceFilter);
        document.getElementById('scenarioFilter').addEventListener('change', filterAlerts);
        document.getElementById('sourceFilter').addEventListener('change', filterAlerts);
        document.getElementById('targetFilter').addEventListener('change', filterAlerts);
        document.getElementById('dataMode').addEventListener('change', async function(e) {
            await setMode(e.target.value);
        });

        window.addEventListener('DOMContentLoaded', async function() {
            await setMode(MODE_MANIFEST);
        });
    </script>
</body>
</html>
