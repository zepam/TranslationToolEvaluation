name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build alerts data for demo
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(data/stable/portland_*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No files matching data/stable/portland_*.jsonl found"
            exit 1
          fi

          cat "${files[@]}" > demo/alerts.json
          echo "Built demo/alerts.json from ${#files[@]} files"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
