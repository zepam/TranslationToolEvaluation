<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Alert Translation Search</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        h1 {
            color: #333;
            border-bottom: 3px solid #4CAF50;
            padding-bottom: 10px;
        }.search-container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }.search-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }.search-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }
        
        select, input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #4CAF50;
        }.button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }.search-btn {
            background: #4CAF50;
            color: white;
        }.search-btn:hover {
            background: #45a049;
        }.reset-btn {
            background: #f44336;
            color: white;
        }.reset-btn:hover {
            background: #da190b;
        }.results-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: 600;
            color: #1976d2;
        }.alert-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            border-left: 4px solid #4CAF50;
        }.alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }.alert-id {
            font-weight: 700;
            color: #333;
            font-size: 16px;
        }.alert-scenario {
            background: #4CAF50;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }.source-text {
            background: #fff3cd;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            border-left: 3px solid #ffc107;
        }.source-label {
            font-weight: 600;
            color: #856404;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }.translations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
        }.translation-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }.lang-code {
            font-weight: 700;
            color: #1976d2;
            text-transform: uppercase;
            font-size: 12px;
            margin-bottom: 5px;
        }.translation-text {
            color: #333;
            line-height: 1.5;
        }.no-results {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 8px;
            color: #666;
        }.loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #666;
        }.pagination-controls {
            margin: 20px 0 40px;
            display: flex;
            justify-content: center;
        }.load-more-btn {
            background: #1976d2;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }.load-more-btn:hover {
            background: #125ca1;
        }
    </style>
</head>
<body>
    <h1>🚨 Emergency Alert Translation Search</h1>
    
    <div class="search-container">
        <div class="search-row">
            <div class="search-group">
                <label for="scenarioFilter">Alert Type (Scenario):</label>
                <select id="scenarioFilter">
                    <option value="">All Scenarios</option>
                </select>
            </div>
            
            <div class="search-group">
                <label for="sourceFilter">Source Language:</label>
                <select id="sourceFilter">
                    <option value="">All Source Languages</option>
                </select>
            </div>
            
            <div class="search-group">
                <label for="targetFilter">Target Language:</label>
                <select id="targetFilter">
                    <option value="">All Target Languages</option>
                </select>
            </div>
            
            <div class="search-group">
                <label for="textSearch">Search Text:</label>
                <input type="text" id="textSearch" placeholder="Search in translations...">
            </div>
        </div>
        
        <div class="button-group">
            <button class="search-btn" onclick="filterAlerts()">🔍 Search</button>
            <button class="reset-btn" onclick="resetFilters()">↻ Reset</button>
        </div>
    </div>
    
    <div id="resultsInfo" class="results-info" style="display: none;"></div>
    <div id="output"></div>
    <div id="paginationControls" class="pagination-controls"></div>

    <script>
        let alertsData = [];
        let filteredAlerts = [];
        let manifest = null;
        const scenarioCache = {};
        const scenarioCacheOrder = [];
        let currentPage = 1;
        const PAGE_SIZE = 25;
        const MANIFEST_PATH = 'data/manifest.json';
        const SCENARIO_CACHE_LIMIT = 4;
        const MAX_FILTERED_ALERTS_BUFFER = 1500;
        let searchDebounceTimer = null;
        let totalMatchingAlerts = 0;
        let totalAlertsScanned = 0;
        let matchesWereTruncated = false;
        let activeFilterRequestId = 0;
        const FILTER_CANCELLED_ERROR = 'FILTER_CANCELLED';
        
        function debounceFilter() {
            if (searchDebounceTimer) {
                clearTimeout(searchDebounceTimer);
            }
            searchDebounceTimer = setTimeout(filterAlerts, 250);
        }

        function isEnglishLanguage(langCode) {
            const code = (langCode || '').toLowerCase();
            return code === 'en' || code === 'eng' || code === 'english';
        }

        function formatAlertId(alertId) {
            const id = String(alertId || '');
            const firstDash = id.indexOf('-');
            if (firstDash !== -1 && firstDash < id.length - 1) {
                return id.slice(firstDash + 1);
            }
            return id;
        }

        function preloadAlertMetadata(alert) {
            alert.__sourceLang = Object.keys(alert.source || {})[0] || 'eng';
            return alert;
        }

        function touchScenarioInCache(scenario) {
            const existingIndex = scenarioCacheOrder.indexOf(scenario);
            if (existingIndex !== -1) {
                scenarioCacheOrder.splice(existingIndex, 1);
            }
            scenarioCacheOrder.push(scenario);

            while (scenarioCacheOrder.length > SCENARIO_CACHE_LIMIT) {
                const oldest = scenarioCacheOrder.shift();
                delete scenarioCache[oldest];
            }
        }

        function alertMatchesFilters(alert, sourceLang, targetLang, searchText) {
            if (sourceLang && !alert.source[sourceLang]) {
                return false;
            }

            if (targetLang && !alert.translations[targetLang]) {
                return false;
            }

            if (searchText) {
                const sourceText = Object.values(alert.source || {}).join(' ').toLowerCase();
                const translationsText = Object.values(alert.translations || {}).join(' ').toLowerCase();
                if (!sourceText.includes(searchText) && !translationsText.includes(searchText)) {
                    return false;
                }
            }

            return true;
        }

        function collectMatchesFromAlerts(alerts, sourceLang, targetLang, searchText) {
            const matched = [];
            let matchCount = 0;
            let truncated = false;

            for (let i = 0; i < alerts.length; i++) {
                const alert = alerts[i];
                if (!alertMatchesFilters(alert, sourceLang, targetLang, searchText)) {
                    continue;
                }

                matchCount += 1;
                if (matched.length < MAX_FILTERED_ALERTS_BUFFER) {
                    matched.push(alert);
                } else {
                    truncated = true;
                }
            }

            return {
                matched,
                matchCount,
                scannedCount: alerts.length,
                truncated
            };
        }

        function renderPaginationControls() {
            const controls = document.getElementById('paginationControls');
            const shown = Math.min(currentPage * PAGE_SIZE, filteredAlerts.length);

            if (shown < filteredAlerts.length) {
                controls.innerHTML = `<button class="load-more-btn" onclick="loadMoreAlerts()">Load more (${shown}/${Math.min(totalMatchingAlerts, filteredAlerts.length)})</button>`;
                return;
            }

            if (matchesWereTruncated) {
                controls.innerHTML = '<div class="results-info">Large result set detected. Showing a limited buffer of matches. Add filters to narrow results.</div>';
                return;
            }

            if (shown >= filteredAlerts.length) {
                controls.innerHTML = '';
                return;
            }
        }

        function loadMoreAlerts() {
            currentPage += 1;
            displayAlerts(filteredAlerts);
            showResultsInfo(totalMatchingAlerts, totalAlertsScanned);
            renderPaginationControls();
        }

        function setOutputLoading(message) {
            document.getElementById('output').innerHTML = `<div class="loading">${message}</div>`;
        }

        async function parseJsonlResponse(response) {
            if (!response.body) {
                const text = await response.text();
                return parseJsonlTextFallback(text);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffered = '';
            const parsedAlerts = [];

            while (true) {
                const { value, done } = await reader.read();
                buffered += decoder.decode(value || new Uint8Array(), { stream: !done });

                const lines = buffered.split('\n');
                buffered = lines.pop() || '';

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) {
                        continue;
                    }
                    try {
                        parsedAlerts.push(preloadAlertMetadata(JSON.parse(line)));
                    } catch (parseError) {
                        console.warn('Skipping malformed JSONL line', parseError);
                    }

                    if (parsedAlerts.length > 0 && parsedAlerts.length % 500 === 0) {
                        await new Promise(resolve => setTimeout(resolve, 0));
                    }
                }

                if (done) {
                    break;
                }
            }

            if (buffered.trim()) {
                try {
                    parsedAlerts.push(preloadAlertMetadata(JSON.parse(buffered.trim())));
                } catch (parseError) {
                    console.warn('Skipping malformed JSONL trailing line', parseError);
                }
            }

            return parsedAlerts;
        }

        async function parseJsonlTextFallback(text) {
            const lines = text.trim().split('\n');
            const parsedAlerts = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) {
                    continue;
                }
                try {
                    parsedAlerts.push(preloadAlertMetadata(JSON.parse(line)));
                } catch (parseError) {
                    console.warn('Skipping malformed JSONL line', parseError);
                }

                if (i > 0 && i % 250 === 0) {
                    await new Promise(resolve => setTimeout(resolve, 0));
                }
            }

            return parsedAlerts;
        }

        async function loadScenarioData(scenario) {
            if (scenarioCache[scenario]) {
                return scenarioCache[scenario];
            }

            const path = manifest.files[scenario];
            const response = await fetch(path);
            if (!response.ok) {
                throw new Error(`Failed to load scenario file: ${scenario}`);
            }

            const parsed = await parseJsonlResponse(response);
            scenarioCache[scenario] = parsed;
            touchScenarioInCache(scenario);
            return parsed;
        }

        async function gatherMatchesAcrossScenarios(sourceLang, targetLang, searchText, requestId) {
            const matched = [];
            let matchCount = 0;
            let scannedCount = 0;
            let truncated = false;

            for (let i = 0; i < manifest.scenarios.length; i++) {
                if (requestId !== activeFilterRequestId) {
                    throw new Error(FILTER_CANCELLED_ERROR);
                }

                const scenario = manifest.scenarios[i];
                setOutputLoading(`Filtering scenario ${i + 1} of ${manifest.scenarios.length}...`);
                const scenarioAlerts = await loadScenarioData(scenario);
                scannedCount += scenarioAlerts.length;

                for (let j = 0; j < scenarioAlerts.length; j++) {
                    if (requestId !== activeFilterRequestId) {
                        throw new Error(FILTER_CANCELLED_ERROR);
                    }

                    const alert = scenarioAlerts[j];
                    if (alertMatchesFilters(alert, sourceLang, targetLang, searchText)) {
                        matchCount += 1;
                        if (matched.length < MAX_FILTERED_ALERTS_BUFFER) {
                            matched.push(alert);
                        } else {
                            truncated = true;
                        }
                    }

                    if (j > 0 && j % 750 === 0) {
                        await new Promise(resolve => setTimeout(resolve, 0));
                    }
                }
            }

            return { matched, matchCount, scannedCount, truncated };
        }

        // Load JSON data
        async function loadData() {
            try {
                setOutputLoading('Loading metadata...');
                const response = await fetch(MANIFEST_PATH);
                if (!response.ok) {
                    throw new Error('Could not load data manifest.');
                }

                manifest = await response.json();
                populateFilters();

                if (manifest.scenarios.length > 0) {
                    document.getElementById('scenarioFilter').value = manifest.scenarios[0];
                }

                await filterAlerts();
            } catch (error) {
                document.getElementById('output').innerHTML = 
                    `<div class="no-results">
                        <h2>Error Loading Data</h2>
                        <p>${error.message}</p>
                        <p>Make sure demo/data/manifest.json and scenario JSONL files exist.</p>
                    </div>`;
            }
        }
        
        // Populate filter dropdowns
        function populateFilters() {
            // Get unique scenarios
            const scenarios = [...(manifest?.scenarios || [])].sort();
            const scenarioSelect = document.getElementById('scenarioFilter');
            scenarios.forEach(scenario => {
                const option = document.createElement('option');
                option.value = scenario;
                option.textContent = scenario.replace(/_/g, ' ').toUpperCase();
                scenarioSelect.appendChild(option);
            });
            
            // Get unique source languages
            const sourceLanguages = [...(manifest?.source_languages || [])].sort();
            const sourceSelect = document.getElementById('sourceFilter');
            sourceLanguages.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang;
                option.textContent = lang.toUpperCase();
                sourceSelect.appendChild(option);
            });
            
            // Get unique target languages
            const targetLanguages = [...(manifest?.target_languages || [])]
                .filter(lang => !isEnglishLanguage(lang))
                .sort();
            const targetSelect = document.getElementById('targetFilter');
            targetLanguages.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang;
                option.textContent = lang.toUpperCase();
                targetSelect.appendChild(option);
            });
        }
        
        // Filter alerts based on search criteria
        async function filterAlerts() {
            const requestId = ++activeFilterRequestId;
            const scenario = document.getElementById('scenarioFilter').value;
            const sourceLang = document.getElementById('sourceFilter').value;
            const targetLang = document.getElementById('targetFilter').value;
            const searchText = document.getElementById('textSearch').value.toLowerCase();

            setOutputLoading('Loading alerts...');

            try {
                if (scenario) {
                    alertsData = await loadScenarioData(scenario);
                    const scenarioMatches = collectMatchesFromAlerts(alertsData, sourceLang, targetLang, searchText);
                    filteredAlerts = scenarioMatches.matched;
                    totalMatchingAlerts = scenarioMatches.matchCount;
                    totalAlertsScanned = scenarioMatches.scannedCount;
                    matchesWereTruncated = scenarioMatches.truncated;
                } else {
                    const allScenarioMatches = await gatherMatchesAcrossScenarios(sourceLang, targetLang, searchText, requestId);
                    filteredAlerts = allScenarioMatches.matched;
                    totalMatchingAlerts = allScenarioMatches.matchCount;
                    totalAlertsScanned = allScenarioMatches.scannedCount;
                    matchesWereTruncated = allScenarioMatches.truncated;
                }

                if (requestId !== activeFilterRequestId) {
                    return;
                }

                currentPage = 1;
                displayAlerts(filteredAlerts);
                showResultsInfo(totalMatchingAlerts, totalAlertsScanned);
                renderPaginationControls();
            } catch (error) {
                if (error && error.message === FILTER_CANCELLED_ERROR) {
                    return;
                }
                throw error;
            }
        }
        
        // Display results info
        function showResultsInfo(filtered, total) {
            const info = document.getElementById('resultsInfo');
            info.style.display = 'block';
            const shown = Math.min(currentPage * PAGE_SIZE, filteredAlerts.length);
            info.textContent = `Showing ${shown} of ${filtered} matching alerts (scanned: ${total})`;
        }
        
        // Display alerts
        function displayAlerts(alerts) {
            const output = document.getElementById('output');
            const targetLang = document.getElementById('targetFilter').value;
            const visibleAlerts = alerts.slice(0, currentPage * PAGE_SIZE);
            
            if (alerts.length === 0) {
                output.innerHTML = `
                    <div class="no-results">
                        <h2>No Results Found</h2>
                        <p>Try adjusting your search criteria.</p>
                    </div>`;
                return;
            }
            
            let html = '';
            visibleAlerts.forEach(alert => {
                const sourceLang = alert.__sourceLang;
                const sourceText = alert.source[sourceLang];
                const translationEntries = Object.entries(alert.translations || {})
                    .filter(([lang]) => !isEnglishLanguage(lang));
                let renderedTranslations = translationEntries;

                if (targetLang) {
                    renderedTranslations = translationEntries.filter(([lang]) => lang === targetLang);
                }
                
                html += `
                    <div class="alert-card">
                        <div class="alert-header">
                            <span class="alert-id">${formatAlertId(alert.id)}</span>
                            <span class="alert-scenario">${alert.scenario.replace(/_/g, ' ')}</span>
                        </div>
                        
                        <div class="source-text">
                            <div class="source-label">Source (${sourceLang.toUpperCase()})</div>
                            <div>${sourceText}</div>
                        </div>
                        
                        <div class="translations-grid">
                `;
                
                // Display translations
                for (const [lang, text] of renderedTranslations) {
                    html += `
                        <div class="translation-item">
                            <div class="lang-code">${lang}</div>
                            <div class="translation-text">${text}</div>
                        </div>
                    `;
                }
                
                html += `
                        </div>
                    </div>
                `;
            });
            
            output.innerHTML = html;
        }
        
        // Reset filters
        async function resetFilters() {
            document.getElementById('scenarioFilter').value = '';
            document.getElementById('sourceFilter').value = '';
            document.getElementById('targetFilter').value = '';
            document.getElementById('textSearch').value = '';
            await filterAlerts();
        }
        
        // Add enter key and debounce support for text search
        document.getElementById('textSearch').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                filterAlerts();
            }
        });
        document.getElementById('textSearch').addEventListener('input', debounceFilter);
        document.getElementById('scenarioFilter').addEventListener('change', filterAlerts);
        
        // Load data on page load
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
