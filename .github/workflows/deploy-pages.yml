name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build scenario data and manifest for demo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p demo/data
          rm -f demo/alerts.json

          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          stable_dir = Path("data/stable")
          demo_data_dir = Path("demo/data")
          demo_data_dir.mkdir(parents=True, exist_ok=True)

          files = sorted(stable_dir.glob("portland_*.jsonl"))
          if not files:
            raise SystemExit("No files matching data/stable/portland_*.jsonl found")

          source_languages = set()
          target_languages = set()
          manifest = {
            "scenarios": [],
            "files": {},
            "counts": {},
            "source_languages": [],
            "target_languages": [],
            "total_alerts": 0,
          }

          for src in files:
            scenario = src.stem.replace("portland_", "", 1)
            dst = demo_data_dir / src.name
            shutil.copy2(src, dst)

            valid_count = 0
            with src.open("r", encoding="utf-8") as fh:
              for line in fh:
                line = line.strip()
                if not line:
                  continue
                try:
                  alert = json.loads(line)
                except json.JSONDecodeError:
                  continue
                valid_count += 1
                source_languages.update((alert.get("source") or {}).keys())
                target_languages.update((alert.get("translations") or {}).keys())

            manifest["scenarios"].append(scenario)
            manifest["files"][scenario] = f"data/{src.name}"
            manifest["counts"][scenario] = valid_count
            manifest["total_alerts"] += valid_count

          manifest["source_languages"] = sorted(source_languages)
          manifest["target_languages"] = sorted(target_languages)

          (demo_data_dir / "manifest.json").write_text(
            json.dumps(manifest, ensure_ascii=True, indent=2),
            encoding="utf-8",
          )

          print(f"Prepared {len(files)} scenario files")
          print(f"Total alerts: {manifest['total_alerts']}")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
